<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Snacki</title>
    <base href="/" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#357bff" />
    <meta name="description" content="Snacki: escanea, come y gana puntos en tus tiendas de snacks favoritas." />
    <link rel="icon" href="assets/icon/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #fff;
        opacity: 1;
        transition: opacity 300ms ease;
      }
      #app-loading img {
        display: block;
        width: min(52vw, 220px);
        height: auto;
        animation: snacki-load-pulse 1.2s ease-in-out infinite alternate;
      }
      #app-loading.is-hiding { opacity: 0; pointer-events: none; }
      @keyframes snacki-load-pulse {
        from { transform: scale(.96); }
        to { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading img { animation: none; }
        #app-loading { transition-duration: 0ms; }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" role="status" aria-label="Cargando Snacki">
      <img src="assets/icon/icon-snacki.png" alt="Snacki" />
    </div>
    <app-root></app-root>
  </body>
</html>
