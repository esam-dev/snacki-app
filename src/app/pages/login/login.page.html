<ion-content class="snacki-page" [fullscreen]="true">
  <div class="login-wrap">
    <h1 class="brand">SNACKI</h1>

    <ion-input
      class="snacki-input"
     
      type="text"
      placeholder="Nombre de Usuario o Correo Electronico"
      [(ngModel)]="usuario"
    ></ion-input>

    <ion-input
      class="snacki-input"
     
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
    ></ion-input>

    <div class="actions">
      <ion-button class="snacki-btn" shape="round" (click)="iniciarSesion()">Iniciar Sesion</ion-button>
      <ion-button class="snacki-btn" shape="round" (click)="olvideContrasena()">Olvidaste la Contraseña?</ion-button>
      <ion-button class="snacki-btn" shape="round" (click)="registrarse()">Registrarse a Snacki</ion-button>
    </div>
  </div>
</ion-content>
