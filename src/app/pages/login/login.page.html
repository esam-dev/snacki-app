<ion-content class="snacki-page" [fullscreen]="true">
  <div class="login-wrap">
    <!-- Hero de marca: logo con nombre + tagline -->
    <header class="brand-hero">
      <img
        class="brand-logo"
        src="assets/img/logo-snacki.png"
        alt="Snacki"
        width="240"
        height="80"
      />
      <p class="tagline">Escanea, come y gana puntos</p>
    </header>

    <div class="account-switch" role="group" aria-label="Tipo de cuenta">
      <button type="button" [class.active]="tipoCuenta === 'cliente'" [attr.aria-pressed]="tipoCuenta === 'cliente'" (click)="tipoCuenta = 'cliente'">
        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
        <span>Usuario</span>
        <small>Acumula y canjea puntos</small>
      </button>
      <button type="button" [class.active]="tipoCuenta === 'comercio'" [attr.aria-pressed]="tipoCuenta === 'comercio'" (click)="tipoCuenta = 'comercio'">
        <ion-icon name="storefront-outline" aria-hidden="true"></ion-icon>
        <span>Comercio</span>
        <small>Administra recompensas</small>
      </button>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <label class="snacki-label">{{ tipoCuenta === 'comercio' ? 'Correo del comercio' : 'Usuario o Correo Electrónico' }}</label>
      <ion-input
        class="snacki-input"
        name="usuario"
        type="text"
        autocomplete="username"
        aria-label="Usuario o Correo Electrónico"
        placeholder="Tu usuario o correo"
        [(ngModel)]="usuario"
      >
        <ion-icon slot="start" aria-hidden="true" name="person-outline"></ion-icon>
      </ion-input>

      <label class="snacki-label">Contraseña</label>
      <div class="with-icon">
        <ion-input
          class="snacki-input"
          name="password"
          [type]="verPassword ? 'text' : 'password'"
          autocomplete="current-password"
          aria-label="Contraseña"
          placeholder="Tu contraseña"
          [(ngModel)]="password"
        >
          <ion-icon slot="start" aria-hidden="true" name="lock-closed-outline"></ion-icon>
        </ion-input>
        <button
          type="button"
          class="eye"
          (click)="verPassword = !verPassword"
          [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <ion-icon aria-hidden="true" [name]="verPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <ion-button class="snacki-btn submit" type="submit" expand="block" [disabled]="cargando">Iniciar Sesión</ion-button>
    </form>

    <div class="center">
      <ion-button class="link-btn" fill="clear" size="small" (click)="olvideContrasena()">
        ¿Olvidaste tu contraseña?
      </ion-button>
    </div>

    <footer class="signup-row">
      <span>¿No tienes una cuenta?</span>
      <ion-button class="link-btn signup" fill="clear" size="small" (click)="registrarse()">
        Regístrate
      </ion-button>
    </footer>
  </div>
</ion-content>

@if (cargando) {
  <div class="login-loading" role="status" aria-live="polite" aria-label="Cargando Snacki">
    <img src="assets/icon/icon-snacki.png" alt="" />
    <span>Preparando tu wallet...</span>
  </div>
}
