<ion-content class="snacki-page" [fullscreen]="true">
  <app-snacki-header [back]="true"></app-snacki-header>

  <p class="hint">Escanee el Codigo QR del Local Asociado<br />para ver las ofertas y promociones.</p>

  <div class="qr-box">
    <img class="qr" src="assets/img/qr-placeholder.png" alt="Código QR" />
    <img class="frame" src="assets/img/qr-frame.png" alt="" aria-hidden="true" />
  </div>

  <div class="center">
    <ion-button class="snacki-btn" shape="round" [disabled]="escaneando" (click)="escanear()">
      Escanear Codigo QR
    </ion-button>
  </div>
</ion-content>
